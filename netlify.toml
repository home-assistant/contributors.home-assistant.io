# Netlify builds the site from source. Node comes from .node-version, pnpm
# from the packageManager field in package.json (through Corepack).
#
# The live components (public/components/) and their static assets
# (public/static/) are committed, so a build needs no frontend checkout.
# Redirects are generated from redirects/ by `pnpm redirects`, which the
# build runs first: public/_redirects ends up in dist/.
#
# netlify/edge-functions/markdown.ts sends the Markdown version of a page to
# agents that ask for it with `Accept: text/markdown`.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

# Astro and the component bundle put a content hash in their file names, so
# those files never change and can be cached for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/components/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
