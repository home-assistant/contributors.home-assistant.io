    - name: "--ha-heading-card-subtitle-color"
      file: "src/panels/lovelace/cards/hui-heading-card.ts"
      description: "The color of a subtitle of a heading card."
    - name: "--ha-picture-card-text-color"
      file: "src/panels/lovelace/cards/hui-picture-glance-card.ts"
      description: "The text on top of the picture of the picture entity and picture glance cards."
    - name: "--ha-picture-icon-button-color"
      file: "src/panels/lovelace/cards/hui-picture-glance-card.ts"
      description: "The icons of a picture glance card, for entities that are off."
    - name: "--ha-picture-icon-button-on-color"
      file: "src/panels/lovelace/cards/hui-picture-glance-card.ts"
      description: "The icons of a picture glance card, for entities that are on."
    - name: "--section-header-text-color"
      file: "src/panels/lovelace/special-rows/hui-section-row.ts"
