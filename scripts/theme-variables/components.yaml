# The component variables the theme variables reference lists: custom
# properties a component reads with a fallback, that a theme is meant to set.
# Which ones are meant for themes is a judgement, so this list is kept by
# hand. `pnpm theme-variables` reads the default from `file`, and reports an
# entry when the file no longer reads the variable.
#
# Each group is a section of the page. Each variable has its name, the
# frontend file the default is read from, and what it changes.

- group: "Cards"
  variables:
    - name: "--ha-card-background"
      file: "src/components/ha-card.ts"
      description: "The background of cards."
    - name: "--ha-card-backdrop-filter"
      file: "src/components/ha-card.ts"
      description: "A backdrop filter behind cards, like a blur."
    - name: "--ha-card-border-radius"
      file: "src/components/ha-card.ts"
      description: "The roundness of the corners of cards. Many other surfaces, like tiles and expansion panels, follow it."
    - name: "--ha-card-border-width"
      file: "src/components/ha-card.ts"
      description: "The width of the border of cards."
    - name: "--ha-card-border-color"
      file: "src/components/ha-card.ts"
      description: "The color of the border of cards."
    - name: "--ha-card-box-shadow"
      file: "src/components/ha-card.ts"
      description: "The shadow of cards."
    - name: "--ha-card-header-color"
      file: "src/components/ha-card.ts"
      description: "The color of the title of a card."
    - name: "--ha-card-header-font-family"
      file: "src/components/ha-card.ts"
      description: "The font of the title of a card."
    - name: "--ha-card-header-font-size"
      file: "src/components/ha-card.ts"
      description: "The size of the title of a card."
    - name: "--ha-card-feature-gap"
      file: "src/panels/lovelace/card-features/hui-card-features.ts"
      description: "The space between the features of a card."

- group: "Dashboard layout"
  variables:
    - name: "--masonry-view-card-margin"
      file: "src/panels/lovelace/views/hui-masonry-view.ts"
      description: "The margin around cards in the masonry and sidebar views."
    - name: "--ha-view-sections-column-min-width"
      file: "src/panels/lovelace/views/hui-sections-view.ts"
      description: "The narrowest a column of the sections view gets."
    - name: "--ha-view-sections-column-max-width"
      file: "src/panels/lovelace/views/hui-sections-view.ts"
      description: "The widest a column of the sections view gets."
    - name: "--ha-view-sections-column-gap"
      file: "src/panels/lovelace/views/hui-sections-view.ts"
      description: "The space between the columns of the sections view."
    - name: "--ha-view-sections-narrow-column-gap"
      file: "src/panels/lovelace/views/hui-sections-view.ts"
      description: "The space between the columns of the sections view on narrow screens."
    - name: "--ha-view-sections-row-gap"
      file: "src/panels/lovelace/views/hui-sections-view.ts"
      description: "The space between the rows of the sections view."
    - name: "--ha-view-sections-row-height"
      file: "src/panels/lovelace/views/hui-sections-view.ts"
      description: "The height of a row of the sections view."
    - name: "--ha-view-sections-extra-top-margin"
      file: "src/panels/lovelace/views/hui-sections-view.ts"
      description: "The space above the sections view."
    - name: "--ha-section-grid-column-gap"
      file: "src/panels/lovelace/sections/hui-grid-section.ts"
      description: "The space between the cards of a section, side by side."
    - name: "--ha-section-grid-row-gap"
      file: "src/panels/lovelace/sections/hui-grid-section.ts"
      description: "The space between the rows of cards in a section."
    - name: "--ha-section-grid-row-height"
      file: "src/panels/lovelace/sections/hui-grid-section.ts"
      description: "The height of a row of cards in a section."
    - name: "--ha-section-background-color"
      file: "src/panels/lovelace/sections/hui-section-background.ts"
      description: "The background of a section that has one turned on."
    - name: "--ha-section-border-radius"
      file: "src/panels/lovelace/sections/section-container.ts"
      description: "The roundness of the corners of a section."
    - name: "--grid-card-gap"
      file: "src/panels/lovelace/cards/hui-grid-card.ts"
      description: "The space between the cards of a grid card."
    - name: "--stack-card-gap"
      file: "src/panels/lovelace/cards/hui-vertical-stack-card.ts"
      description: "The space between the cards of a horizontal or vertical stack card."
    - name: "--horizontal-stack-card-gap"
      file: "src/panels/lovelace/cards/hui-horizontal-stack-card.ts"
      description: "The space between the cards of a horizontal stack card."
    - name: "--vertical-stack-card-gap"
      file: "src/panels/lovelace/cards/hui-vertical-stack-card.ts"
      description: "The space between the cards of a vertical stack card."

- group: "Cards and rows"
