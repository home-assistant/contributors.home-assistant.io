name: Component docs drift

# Compares the "In code" sections of the component pages in the Design area
# with the frontend source on dev, once a week, with
# scripts/check-component-docs.ts. Keeps one issue up to date with what the
# pages document that the frontend no longer has: it opens the issue when
# that list is not empty, updates it while it stays that way, and closes it
# when the list is empty again.
#
# The check only reads the frontend with Git. Nothing from the frontend is
# installed or run.

on:
  schedule:
    # Mondays at 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the component pages
    if: ${{ github.repository_owner == 'home-assistant' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Side by side, so the check finds the frontend at its default place,
      # ../frontend.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      - name: Check out the frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/frontend
          ref: dev
          path: frontend
          persist-credentials: false

      # The version of pnpm comes from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      # An explicit bash adds pipefail, so a crashing check fails the step
      # instead of hiding behind tee.
      - name: Check the component pages
        working-directory: site
        shell: bash
        run: pnpm --silent check:component-docs --json "$RUNNER_TEMP/drift.json" | tee "$RUNNER_TEMP/drift.md"

      - name: Update the drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'drift.json'), 'utf8'));
            const markdown = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'drift.md'), 'utf8');

            // The marker finds the issue again, whatever its title says.
            const marker = '<!-- component-docs-drift -->';
            const label = 'area: design';
            const commit = report.frontend.commit.slice(0, 10);

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const issue = openIssues.find((item) => !item.pull_request && item.body?.includes(marker));

            // Removed source files and components count as drift too.
            const driftCount = report.missingCount + report.goneCount;

            if (driftCount === 0) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `The component pages match home-assistant/frontend@${commit} again. Closing.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                console.log(`Closed #${issue.number}`);
              } else {
                console.log('No drift, and no open issue.');
              }
              return;
            }

            // The full report per page goes in a collapsed section, so the
            // list to act on stays on top.
            const [summary, perPage = ''] = markdown.split(/^## Per page$/m);
            const skill = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/skills/design-component-page/SKILL.md`;
            let body = [
              marker,
              'The weekly [Component docs drift workflow](' +
                `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) ` +
                'keeps this issue up to date, and closes it when the pages match the frontend again.',
              '',
              'To fix a page, read the component on the `dev` branch of the frontend, and follow the ' +
                `[\`design-component-page\` skill](${skill}). ` +
                'Run `pnpm check:component-docs` against a frontend checkout before and after.',
              '',
              summary.replace(/^# Component docs drift\n+/, '').trim(),
              '',
              '<details>',
              '<summary>Every page</summary>',
              '',
              perPage.trim(),
              '',
              '</details>'
            ].join('\n');

            // The limit of an issue body.
            if (body.length > 65000) {
              body = `${body.slice(0, 65000)}\n\n</details>\n\nThe report was cut off. Run the check locally for all of it.`;
            }

            const title = `Component pages document API the frontend no longer has (${driftCount})`;

            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body
              });
              console.log(`Updated #${issue.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label]
              });
              console.log(`Opened #${created.number}`);
            }
