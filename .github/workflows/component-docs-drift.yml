name: Component docs drift

# Compares the "In code" sections of the component pages in the Design area
# with the frontend source on dev, once a week, with
# scripts/check-component-docs.ts. Keeps one issue up to date with what the
# pages document that the frontend no longer has: it opens the issue when
# that list is not empty, updates it while it stays that way, and closes it
# when the list is empty again. How the issue is kept up to date is in
# .github/scripts/update-drift-issue.mts.
#
# The check only reads the frontend with Git. Nothing from the frontend is
# installed or run.

on:
  schedule:
    # Mondays at 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the component pages
    if: ${{ github.repository_owner == 'home-assistant' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Side by side, so the check finds the frontend at its default place,
      # ../frontend.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      - name: Check out the frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/frontend
          ref: dev
          path: frontend
          persist-credentials: false

      # The version of pnpm comes from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      # An explicit bash adds pipefail, so a crashing check fails the step
      # instead of hiding behind tee.
      - name: Check the component pages
        working-directory: site
        shell: bash
        run: pnpm --silent check:component-docs --json "$RUNNER_TEMP/drift.json" | tee "$RUNNER_TEMP/drift.md"

      - name: Update the drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: updateDriftIssue } = await import(
              `${process.env.GITHUB_WORKSPACE}/site/.github/scripts/update-drift-issue.mts`
            );
            await updateDriftIssue({ github, context });
