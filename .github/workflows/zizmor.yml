name: zizmor

# Checks the GitHub Actions workflows for security problems with zizmor
# (https://docs.zizmor.sh/), like template injection, overly broad
# permissions, or unpinned actions. A finding fails the check. To accept one
# on purpose, add a `# zizmor: ignore[<audit>]` comment on that line, with the
# reason.
#
# The findings show in the log. Code scanning needs GitHub Advanced Security
# while the repository is private; once it is public, `advanced-security` can
# be turned on to show them under the Security tab instead.

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Check the workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
