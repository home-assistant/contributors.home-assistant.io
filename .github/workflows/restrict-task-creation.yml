name: Restrict task creation

# Task issues are for staff and authorized contributors. Anyone else who
# opens one gets a friendly pointer to the right place, and the issue is
# closed. Who is allowed is in .github/scripts/check-task-authorization.mts.

on:
  issues:
    types:
      - opened

# Nothing by default. The job asks for what it needs.
permissions: {}

jobs:
  check-authorization:
    # Only for issues opened with the Task form, which sets the issue type.
    if: ${{ github.repository_owner == 'home-assistant' && github.event.issue.type.name == 'Task' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check if the author is authorized
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Retries a lookup that fails for a moment, like a 502. A 404 is an
          # answer, and is not retried.
          retries: 3
          script: |
            const { default: checkTaskAuthorization } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/check-task-authorization.mts`
            );
            await checkTaskAuthorization({ github, context });
