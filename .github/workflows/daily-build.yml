name: Daily build

# Rebuilds the site on Netlify once a day. Some pages show data the build
# reads from elsewhere, like the upcoming events of the contributor calendar
# (src/lib/events.ts). Without a push to `main`, those only change when the
# site builds, so this keeps them fresh.
#
# It calls a Netlify build hook: a URL that starts a build when it gets a
# POST. The URL is in the repository secret NETLIFY_BUILD_HOOK. Anyone with
# the URL can start builds, so it stays a secret. To set it up, add a build
# hook for `main` in Netlify, under Build hooks, and store its URL as that
# secret under Settings > Secrets and variables > Actions.

on:
  schedule:
    # Every day at 04:15 UTC.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Trigger a Netlify build
    if: ${{ github.repository_owner == 'home-assistant' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call the build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }} # zizmor: ignore[secrets-outside-env] The hook only starts a build, an environment adds nothing.
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::warning::The NETLIFY_BUILD_HOOK secret is not set, so no build was started. Add a Netlify build hook for main as that secret."
            exit 0
          fi

          curl --fail --silent --show-error --max-time 30 \
            --request POST --data "{}" "$NETLIFY_BUILD_HOOK"
          echo "Netlify build started."
