# The labels the workflows and templates in .github/ use. Nothing creates
# them automatically: whoever sets up the repository creates these once,
# and adds a new "area: <id>" label with every new area.
#
# The format is the one of crazy-max/ghaction-github-labeler and
# EndBug/label-sync, so one of those can take over later.
#
# Used by:
# - feedback: the page feedback issue form (.github/ISSUE_TEMPLATE/feedback.yml)
# - area: <id>: the labeler, and the "Give feedback" link on every page
# - area: design: also the component docs drift workflow, on its issue
# - blog, site code, demos, redirects, dependencies: the labeler
# - demos: also the update demos workflow, on its pull request
# - dependencies: Renovate (.github/renovate.json)
# - stale, no-stale, help-wanted: the stale workflow
# - auto-closed: the restrict task creation workflow
# - awaits-parent: draft ports of developers.home-assistant.io pull requests
#   that wait for their code change to merge

- name: "feedback"
  color: "d4c5f9"
  description: "Feedback on a page, from the page feedback form"

- name: "area: start"
  color: "18bcf2"
  description: "The Get started area"

